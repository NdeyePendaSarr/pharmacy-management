{% if form.errors %}
<div class="bg-red-50 border-l-4 border-red-500 rounded-2xl p-5 mb-6" role="alert">
    <p class="font-bold text-red-800 mb-2 flex items-center">
        <i class="fas fa-exclamation-circle mr-2"></i>Le formulaire contient des erreurs
    </p>
    <ul class="list-disc list-inside text-sm text-red-700 space-y-1">
        {% for error in form.non_field_errors %}
        <li>{{ error }}</li>
        {% endfor %}
        {% for field in form %}
            {% for error in field.errors %}
            <li><strong>{{ field.label }}</strong> : {{ error }}</li>
            {% endfor %}
        {% endfor %}
    </ul>
</div>
{% endif %}
