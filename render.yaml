services:
  - type: web
    name: pharmanps-aloucoding
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn pharmanps_alou.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: pharmanps-db
          property: connectionString
      # Compte de démonstration (rôle Vendeur), créé par init_demo au build.
      # Le mot de passe se saisit dans le tableau de bord Render (sync: false).
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: pharmanps-db
    plan: free
    region: frankfurt
