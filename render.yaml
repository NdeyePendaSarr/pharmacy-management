services:
  - type: web
    name: pharmanps-aloucoding
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn pharmanps_alou.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      # Seule adresse publique acceptée (en-tête Host).
      - key: ALLOWED_HOSTS
        value: pharmanps-aloucoding-b8ex.onrender.com
      # Base PostgreSQL hébergée hors de Render (Neon). L'URL de connexion
      # directe (sans « -pooler », avec ?sslmode=require) se saisit dans le
      # tableau de bord Render (sync: false) : elle n'est jamais commitée.
      - key: DATABASE_URL
        sync: false
      # Compte de démonstration (rôle Vendeur), créé par init_demo au build.
      # Le mot de passe se saisit dans le tableau de bord Render (sync: false).
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        sync: false
